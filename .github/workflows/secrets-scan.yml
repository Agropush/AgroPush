name: Secrets Scan

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      # gitleaks/gitleaks-action@v2 now requires a paid GITLEAKS_LICENSE
      # secret for organization-owned repos — this repo doesn't have one,
      # so that action always failed immediately. The gitleaks CLI itself
      # is still free/open-source; running it directly avoids the license
      # gate entirely.
      #
      # --no-git scans the checked-out working tree as plain files rather
      # than walking full git history. This matches .gitleaksignore, whose
      # fingerprints are path:rule:line (no commit hash) — a history-mode
      # scan would produce a different, commit-qualified fingerprint for
      # every historical commit that touched a given line, none of which
      # would ever match the ignore list.
      - name: Run Gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --no-git --redact --verbose
